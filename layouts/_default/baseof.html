{{/* djlint:off H016,H030 */}}
<!doctype html>
<html
  lang="{{ site.Language.Locale }}"
  dir="{{ or site.Language.Direction `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="font-title flex min-h-screen flex-col antialiased">
    {{ partial "header.html" . }}
    <main class="grow">
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      {{ partial "footer.html" . }}
    </footer>
  </body>
</html>
