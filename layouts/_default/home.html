{{ define "main" }}
  {{ $posts := where site.RegularPages.ByDate.Reverse "Section" "posts" }}
  {{ $paginator := .Paginate $posts 5 }}

  {{ range $paginator.Pages }}
    <section
      class="bg-lavender-500 font-title border-lavender-600 border-be p-7 text-sm first:border-bs"
    >
      <time
        class="text-lavender-700"
        datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}"
      >
        {{ .Date.Format "2 Jan 2006" }}
      </time>
      <h2 class="text-white">
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      </h2>
    </section>
  {{ end }}
{{ end }}
